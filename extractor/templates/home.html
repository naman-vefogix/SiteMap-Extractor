<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Sitemap Parser</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        input {
            padding: 10px;
            width: 350px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #results {
            margin-top: 20px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h2>Sitemap Extractor</h2>

    <form id="sitemap-form">
        <input placeholder="https://example.com" type="text" id="website-url">
        <button type="submit">Extract</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>

    <script>

        document
            .getElementById('sitemap-form')
            .addEventListener('submit', async function (e) {

                e.preventDefault();

                const websiteUrl = document.getElementById('website-url').value;
                const statusDiv = document.getElementById('status');
                const resultsDiv = document.getElementById('results');

                statusDiv.innerHTML = 'Fetching sitemap URLs...';
                resultsDiv.innerHTML = '';

                try {

                    const response = await fetch('sitemap-extractor/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCSRFToken()
                        },
                        body: JSON.stringify({ url: websiteUrl })
                    });

                    const data = await response.json();

                    // Stop here on validation errors
                    if (!response.ok) {
                        statusDiv.innerHTML = data.url?.[0] || data.detail || 'Invalid input';
                        return;
                    }

                    statusDiv.innerHTML = 'Processing sitemap...';
                    checkTaskStatus(data.task_id);

                } catch (error) {
                    statusDiv.innerHTML = 'Something went wrong';
                    console.error(error);
                }
            });


        async function checkTaskStatus(taskId) {

            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            const interval = setInterval(async () => {

                try {

                    const response = await fetch(`sitemap-task/${taskId}/`);
                    const data = await response.json();

                    if (data.status === 'SUCCESS') {
                        clearInterval(interval);
                        statusDiv.innerHTML = `Total URLs Found: ${data.result.count}`;

                        let html = '<h3>Top 10 URLs</h3><ul>';
                        data.result.urls.slice(0, 10).forEach(url => {
                            html += `<li><a href="${url}" target="_blank">${url}</a></li>`;
                        });
                        html += '</ul>';
                        resultsDiv.innerHTML = html;
                    }

                    if (data.status === 'FAILURE') {
                        clearInterval(interval);
                        statusDiv.innerHTML = `Failed: ${data.error || 'Unknown error'}`;
                    }

                } catch (error) {
                    clearInterval(interval);
                    statusDiv.innerHTML = 'Something went wrong while checking status';
                    console.error(error);
                }

            }, 2000);
        }


        function getCSRFToken() {
            return document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];
        }

    </script>

</body>

</html>
